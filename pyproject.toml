[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-master"
version = "0.1.0"
description = "Local 9:16 Shorts studio: find the best moment, track the subject, caption and export for TikTok, YouTube Shorts and Instagram Reels."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Sekhou Toure" }]
keywords = ["shorts", "tiktok", "reels", "video", "clips", "ffmpeg", "whisper", "yolo"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Topic :: Multimedia :: Video",
]
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
clip-master = "clip_master_cli:main"

[tool.setuptools]
# Flat layout: the app is run from a source checkout (static/, remotion/, assets/ live next to the code).
py-modules = [
  "agents_crew", "audio_align", "batch_queue", "bootstrap", "clip_master_cli", "config", "llm",
  "pipeline", "presets", "profanity", "qc", "server", "tools_registry", "tracked_render",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.dev = { file = ["requirements-dev.txt"] }

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501", "E701", "E702", "E741", "B008", "B904", "UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402"]
