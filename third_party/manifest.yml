# CLIP MASTER - third-party tools. Single source of truth read by `install.sh` / `install.ps1` / `clip-master doctor`.
#
# kind: pip     -> installed through requirements.txt (listed here for the record: license, purpose)
#       npm     -> installed by `npm install` in remotion/
#       system  -> must exist on the machine (the installer checks it and prints how to install it)
#       binary  -> release archive downloaded into third_party/<name>/ (sha256 checked, pinned tag)
#       git     -> source cloned into third_party/<name>/ at a pinned tag or commit (shallow). Reference only.
# default: false  -> only fetched with `--with-reference` (nothing in the app needs them at runtime).
#
# Nothing in third_party/ is ever committed (see .gitignore): it is fetched on the user's machine.
# Not included on purpose: remotion-dev/skills (no license), LosslessCut (GPL-2.0-only, idea only),
# Video2X (AGPL-3.0, ~1 GB, not used).
# Keep this file to flat "- key: value" entries (the installer can read it without PyYAML).

- name: yt-dlp
  kind: pip
  package: yt-dlp
  url: https://github.com/yt-dlp/yt-dlp
  license: Unlicense
  purpose: Download VODs and clips from almost any site

- name: streamlink
  kind: pip
  package: streamlink
  url: https://github.com/streamlink/streamlink
  license: BSD-2-Clause
  purpose: Record a live stream to a file

- name: PySceneDetect
  kind: pip
  package: scenedetect
  url: https://github.com/Breakthrough/PySceneDetect
  license: BSD-3-Clause
  purpose: Scene and cut detection

- name: auto-editor
  kind: pip
  package: auto-editor
  url: https://github.com/WyattBlue/auto-editor
  license: Unlicense
  purpose: Remove silences and dead air

- name: MediaPipe
  kind: pip
  package: mediapipe
  url: https://github.com/google-ai-edge/mediapipe
  license: Apache-2.0
  purpose: Face (facecam) detection

- name: Ultralytics YOLO
  kind: pip
  package: ultralytics
  url: https://github.com/ultralytics/ultralytics
  license: AGPL-3.0
  purpose: Subject tracking for the 9:16 crop

- name: faster-whisper
  kind: pip
  package: faster-whisper
  url: https://github.com/SYSTRAN/faster-whisper
  license: MIT
  purpose: Local word-level transcription (never needs an API key)

- name: Demucs
  kind: pip
  package: demucs
  url: https://github.com/facebookresearch/demucs
  license: MIT
  purpose: Optional voice / music separation

- name: Remotion
  kind: npm
  package: remotion
  url: https://github.com/remotion-dev/remotion
  license: Remotion License (source-available, free for individuals and small teams)
  purpose: Optional animated React captions (remotion/ folder)

- name: FFmpeg
  kind: system
  command: ffmpeg
  url: https://ffmpeg.org
  license: LGPL-2.1+ / GPL-2.0+ (depending on the build)
  purpose: All encoding, filtering and loudness work (imageio-ffmpeg provides a fallback binary)

- name: Node.js
  kind: system
  command: node
  url: https://nodejs.org
  license: MIT
  purpose: Only for the optional Remotion renderer (version 18 or newer)

