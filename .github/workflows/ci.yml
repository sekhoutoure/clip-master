name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Python packages (CPU-only PyTorch keeps this fast)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -v

  locked-install:
    # The pinned set in requirements-lock/ must keep installing and passing the tests (reproducible installs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock/*.txt
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Pinned packages (CPU-only PyTorch, then the lock)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-lock/linux-x86_64-py312.txt
          pip install pytest~=9.0 httpx~=0.28
          pip check
      - name: Tests
        run: python -m pytest -m "not slow"

  install-smoke:
    # Proves a fresh clone installs with the documented script and passes the doctor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./install.sh --yes --cpu-torch
      - run: ./install.sh --check
