name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got. Paste the error text.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `./install.sh --check`
      description: Windows - `.\install.ps1 -Check`. This tells us your Python, FFmpeg and tool versions.
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Do not attach copyrighted videos. A link to a public, freely-licensed video is fine.
